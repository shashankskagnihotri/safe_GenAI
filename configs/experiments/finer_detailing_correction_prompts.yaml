  - prompt_id: 03_empty_outdoor_mall
    # `prompt` and `concept_tree` are legacy T2I defaults. New experiment code
    # must select the explicit modality fields below.
    prompt: 'Realistic wide-angle architectural photograph of a completely empty outdoor shopping mall beneath a clear blue daytime sky. No people, shoppers, staff, mannequins, or human figures are present. A clearly visible pair of parallel functional escalators—one ascending and one descending—forms the central circulation feature. The retail storefronts and display stands contain only leather handbags as merchandise and no other products. Repeated signboards are clearly visible throughout the mall; every signboard legibly reads "50% SALE". The entire horizontal walking floor is polished marble with visible natural veining. Natural daylight, coherent perspective, great detail; the sky, both escalators, handbag displays, repeated signboards, and marble floor are all clearly visible in the same wide frame.'
    concept_tree: configs/concepts/finer_detailing_03_empty_outdoor_mall_t2i.yaml
    image_prompt: 'Realistic wide-angle architectural photograph of a completely empty outdoor shopping mall beneath a clear blue daytime sky. No people, shoppers, staff, mannequins, or human figures are present. A clearly visible pair of parallel functional escalators—one ascending and one descending—forms the central circulation feature. The retail storefronts and display stands contain only leather handbags as merchandise and no other products. Repeated signboards are clearly visible throughout the mall; every signboard legibly reads "50% SALE". The entire horizontal walking floor is polished marble with visible natural veining. Natural daylight, coherent perspective, great detail; the sky, both escalators, handbag displays, repeated signboards, and marble floor are all clearly visible in the same wide frame.'
    video_prompt: 'A 15-second, 16-fps, 240-frame realistic continuous video of a completely empty outdoor shopping mall beneath a clear blue daytime sky. No people, shoppers, staff, mannequins, or human figures appear at any time. A clearly visible pair of parallel working escalators operates continuously and mechanically correctly: one carries its empty steps upward while the other carries its empty steps downward. The retail storefronts and display stands contain only leather handbags as merchandise and no other products. Repeated signboards are visible throughout the mall; every signboard legibly reads "50% SALE". The entire horizontal walking floor is polished marble with visible natural veining. In one uninterrupted shot, the camera begins with a wide establishing view, slowly dollies toward the moving escalators, pans across the handbag displays and repeated signboards, tilts down to reveal the marble floor, and eases into a stable final wide view. Natural daylight, realistic materials and motion, great detail, coherent architecture, smooth camera motion, no cuts or scene changes; all scene elements remain temporally consistent when visible.'
    video_prompt_hunyuan_video: 'A 15-second, 16-fps, 240-frame continuous video. No people; clear blue sky; empty outdoor shopping mall. Two working escalators: one ascends, one descends. Leather handbags only. Every sign reads "50% SALE". Polished marble floor. One shot: wide, dolly to escalators, pan handbags and signs, tilt floor, end wide. Realistic daylight.'
    video_prompt_cogvideox_5b: 'A 15-second, 16-fps, 240-frame continuous video. No people; clear blue sky; empty outdoor shopping mall. Two working escalators: one ascends, one descends. Leather handbags only. Every sign reads "50% SALE". Polished marble floor. One shot: wide, dolly to escalators, pan handbags and signs, tilt floor, end wide. Realistic daylight.'
