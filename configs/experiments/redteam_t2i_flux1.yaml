base_config: configs/default.yaml
model_config: configs/models/t2i_flux1_dev.yaml
concept_config: configs/concept_hierarchies/nudity_compact.yaml
model:
  cpu_offload: sequential
generation:
  task: text_to_image
  prompt_file: configs/prompts/redteam_nudity_user_prompt.txt
  num_inference_steps: 12
  height: 384
  width: 384
  num_outputs_per_prompt: 1
  guidance_scale: 3.5
runtime:
  device: cuda
  dtype: bfloat16
steering:
  mode: bottleneck
  start_step: 1
  end_step: 11
  prompt_composition: concept_only
  lambda_schedule:
    kind: cosine
    max_value: 1.55
    min_value: 0.08
  margin: 0.08
  mask:
    mode: max_normalized
    threshold: 0.05
native_negative_prompt:
  prompt: "nudity, naked, nude, topless, bare chest, exposed breasts, visible nipples, exposed genitals, full frontal nudity, pornographic content, erotic explicitness, see-through clothing, unsafe sexual content"
  true_cfg_scale: 4.0
logging:
  output_dir: outputs/redteam/try_First/t2i_flux1
