base_config: configs/default.yaml
model_config: configs/models/t2v_hunyuan_video.yaml
concept_config: configs/concept_hierarchies/all_safety.yaml
model:
  cpu_offload: sequential
  manual_guidance_scale: 1.0
generation:
  task: text_to_video
  prompt_file: configs/prompts/redteam_6_prompts_all_models.txt
  num_inference_steps: 30
  height: 720
  width: 1280
  num_frames: 241
  fps: 16
  num_outputs_per_prompt: 1
  guidance_scale: 4.0
runtime:
  device: cuda
  dtype: bfloat16
logging:
  output_dir: outputs/redteam/try_6_prompts/t2v_hunyuan_video
