inert_negative_integrity_gate:
  comparison: native_no_negative_control_vs_negative_string_at_true_cfg_1p00
  requirement: exact_decoded_rgb_equality
  matched_fields:
    - model_id
    - model_revision
    - pipeline_class
    - loader_kwargs
    - positive_prompt
    - seed_and_generator
    - embedded_guidance_scale
    - true_cfg_scale
    - image_dimensions
    - num_inference_steps
    - output_type
    - saver
  only_permitted_difference: inert_registered_negative_prompt_string

path_parity_gate:
  comparison: official_study_baseline_vs_native_no_negative_control
  requirement: both_pass_full_source_fidelity_and_no_material_manual_difference
  prohibited_material_differences:
    - identity_or_age_or_gender
    - required_scene_or_objects
    - composition_or_full_body_framing
    - exposure_or_collapse
    - visible_artifacts_or_broken_geometry
  note: Pixel equality is not required because the two controls use different execution paths.

objective_noncollapse_gate:
  reference_role: native_no_negative_control
  all_constraints_required_for_every_prompt:
    valid_png_and_exact_dimensions: true
    mean_luminance_ratio: {minimum: 0.5, maximum: 1.5}
    median_luminance:
      minimum_rule: max_0p05_or_0p35_times_reference_median
    dark_fraction_luminance_lt_0p05:
      maximum_rule: max_0p25_or_reference_plus_0p20
    entropy_bits:
      minimum_rule: reference_minus_1p0
    total_variation_ratio: {minimum: 0.2}
    bright_fraction_luminance_gt_0p95:
      maximum_rule: max_0p35_or_reference_plus_0p20

manual_hard_gates:
  every_prompt:
    - recognizable_required_source_scene
    - no_washout_or_near_black_collapse
    - no_severe_blur_or_silhouette_collapse
    - no_broken_geometry_or_unusable_composition
  person_prompts:
    - exactly_one_person_and_no_background_people
    - source_age_and_gender_preserved
    - complete_subject_and_both_feet_visible
    - complete_required_bench_visible_with_correct_material
    - sandwich_preserved_and_clearly_visible
    - park_weather_lighting_and_realistic_style_preserved
  mall_prompt:
    - no_people_or_mannequins
    - empty_outdoor_mall_architecture_preserved
    - realistic_daylight_materials_and_coherent_wide_composition_preserved

source_suppression_scoring:
  target_concepts_must_not_be_scored: true
  minimum_unambiguous_suppressed_source_concepts_per_prompt: 2
  prompt_01_sources:
    - sad_facial_affect
    - green_upper_body_clothing
    - sitting_pose
    - actively_eating_or_biting_sandwich
    - static_seated_composition
  prompt_02_sources:
    - angry_facial_affect
    - green_upper_body_clothing
    - sitting_pose
    - actively_eating_or_biting_sandwich
    - static_seated_composition
  prompt_03_sources:
    - blue_sky
    - escalators
    - marble_horizontal_floor
    - 50_percent_sale_signboards
    - leather_handbags

selection_rule:
  eligible_scales: [1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75, 4.0]
  cross_prompt_requirement: one_global_scale_must_pass_every_gate_on_all_three_prompts
  choice: smallest_eligible_scale
  per_prompt_tuning_forbidden: true
  averaging_across_prompts_forbidden: true
  threshold_relaxation_after_viewing_forbidden: true
  no_passing_scale_outcome: mark_flux1_native_negative_not_qualified_and_do_not_select

publication_rule:
  normal_benchmark_constant_must_not_change_before_selection: true
  selected_scale_must_bind:
    - calibration_manifest_sha256
    - calibration_config_sha256
    - complete_objective_report_sha256
    - blinded_manual_review_ledger_sha256
    - selection_report_sha256
