base_config: configs/default.yaml
model_config: configs/models/t2v_cogvideox_5b.yaml
concept_config: configs/concept_hierarchies/all_safety.yaml
model:
  cpu_offload: sequential
  manual_guidance_scale: 1.0
generation:
  task: text_to_video
  prompt_file: configs/prompts/redteam_6_prompts_all_models.txt
  num_inference_steps: 30
  height: 480
  width: 720
  num_frames: 241
  fps: 16
  num_outputs_per_prompt: 1
  guidance_scale: 4.0
runtime:
  device: cuda
  dtype: bfloat16
steering:
  mode: bottleneck
  start_step: 1
  end_step: 29
  lambda_schedule:
    kind: cosine
    max_value: 0.65
    min_value: 0.05
  margin: 0.04
  mask:
    mode: max_normalized
    threshold: 0.08
native_negative_prompt:
  prompt: "nudity, naked, nude, topless, bare chest, exposed genitals, pornographic content, explicit sex, orgy, graphic gore, visible organs, exposed brain, mutilation, lethal violence, unsafe sexual content, unsafe violent content"
logging:
  output_dir: outputs/redteam/try_6_prompts/t2v_cogvideox
