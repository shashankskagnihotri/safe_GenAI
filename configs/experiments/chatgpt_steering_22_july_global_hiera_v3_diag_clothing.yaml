methods:
  hierasafe_chs_v2:
    implementation: hierasafe_flow.steering.chs_v2
    strength: 1.0
    window:
    - 0.0
    - 1.0
    temporal_profile: rectangular
    max_relative_norm: 0.2
    concept_scope: global_v2_registry_compiled_subset
    diagnostic_only: true
    diagnostic_pair_ids:
    - clothing_color_green_to_red_blue
  midsteer:
    implementation: hierasafe_flow.steering.related_work.midsteer_attn_output
    strength: 1.0
    window:
    - 0.0
    - 1.0
    covariance: full
    control_mode: attn_output_post_projection
    step_policy: first_diffusion_step_reused_at_constant_beta_every_step
    intermediate_clipping: false
  sgf_switch_adaptation:
    implementation: hierasafe_flow.steering.related_work.distribution_switch_v3.sgf_switch_x0
    reference_artifact: switch_references_full_paired_trajectory_515.pt
    reference_construction: full_paired_source_target_conditioned_trajectory
    reference_population: 515
    reference_population_per_side: 515
    strength: 0.03
    unified_timestep_window:
    - 1000.0
    - 800.0
    top_k: 3
    epsilon: 0.05
    force_policy: paper_negative_raw_kernel_sum_repulsive_plus_paired_target_attraction_v1
    adaptation: paper_negative_plus_paired_target_attraction
    gradient_convention: paper_source_repulsion_plus_paired_target_attraction
    bandwidth_neighbour_policy: paper_skip_first_then_next_k
    temporal_policy: constant_rectangular_unified_diffusion_time
    precision_policy: float32_through_native_schedule_conversion
  safe_denoiser_switch_adaptation:
    implementation: hierasafe_flow.steering.related_work.distribution_switch_v3.safe_denoiser_switch_x0
    reference_artifact: switch_references_full_paired_trajectory_515.pt
    reference_construction: full_paired_source_target_conditioned_trajectory
    reference_population: 515
    reference_population_per_side: 515
    sigma: 2.75
    kernel_distance_policy: released_unsquared_l2
    correction_policy: released_sd3_source_subtraction_plus_paired_target_addition_v1
    scale: 0.03
    unified_timestep_window:
    - 1000.0
    - 780.0
    beta_threshold_margin: 0.0
    official_reference_population: 515
    threshold_quantile: 0.0
    adaptation: source_negative_guidance
    kernel_space: l2_normalized_model_feature_axis_unsquared_l2_rbf
    direction_space: raw_canonical_predicted_x0
    temporal_policy: constant_rectangular_unified_diffusion_time
    threshold_policy: disabled_released_sd3_beta_threshold_false
    precision_policy: float32_through_native_schedule_conversion
calibration:
  reference_seeds:
  - 31001
  - 31002
  - 31003
  midsteer_calibration_seed: 31001
  representation: canonical_predicted_x0
  midsteer_covariance: full
  midsteer_scope: complete_attention_outputs_first_local_diffusion_step_reused
upstreams:
