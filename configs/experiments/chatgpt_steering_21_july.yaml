campaign:
  id: chatgpt_steering_21_july_2026
  seed: 0
  sealed_prompt_source: configs/experiments/finer_detailing_correction_prompts.yaml
  negative_prompt_source: configs/experiments/finer_detailing_correction_negative_prompts.yaml
  ontology_registry: configs/concepts/global_v2/registry.yaml
  compatibility_hierarchy: configs/concepts/global_v2/compatibility_hierarchy.yaml
  state_root: debugging/chatgpt_steering
  calibration_root: debugging/chatgpt_steering/calibration
  output_root: outputs/chatgpt_steering_21_july
  variants:
    - baseline
    - native_negative_prompt
    - conceptsteer_current_repaired
    - hierasafe_chs_v2
    - midsteer
    - sgf_switch_adapted
    - safe_denoiser_switch_adapted
  active_pairs_by_prompt:
    01_sad_young_girl:
      - facial_affect_negative_to_happy
      - body_pose_sitting_to_walking
      - clothing_color_green_to_red_blue
      - sandwich_action_eating_to_holding
      - composition_static_to_dynamic
    02_angry_old_man:
      - facial_affect_negative_to_happy
      - body_pose_sitting_to_walking
      - clothing_color_green_to_red_blue
      - sandwich_action_eating_to_holding
      - composition_static_to_dynamic
    03_empty_outdoor_mall:
      - sky_color_blue_to_pink
      - vertical_circulation_escalators_to_marble_stairs
      - horizontal_floor_marble_to_tile
      - signage_sale_to_new_arrival
      - merchandise_handbags_to_cars

