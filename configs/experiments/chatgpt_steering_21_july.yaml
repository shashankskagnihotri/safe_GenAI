methods:
  conceptsteer_current_repaired:
    implementation: hierasafe_flow.steering.conceptsteer_repaired
    strength: 0.55
    window: [0.02, 0.68]
    max_relative_norm: 0.18
  hierasafe_chs_v2:
    implementation: hierasafe_flow.steering.chs_v2
    strength: 0.62
    window: [0.02, 0.72]
    max_relative_norm: 0.20
  midsteer:
    implementation: hierasafe_flow.steering.related_work.midsteer
    strength: 0.80
    window: [0.05, 0.62]
    covariance: diagonal
  sgf_switch_adapted:
    implementation: hierasafe_flow.steering.related_work.sgf
    strength: 0.075
    bandwidth: 1.0
    window: [0.00, 0.42]
    max_relative_norm: 0.12
  safe_denoiser_switch_adapted:
    implementation: hierasafe_flow.steering.related_work.safe_denoiser
    eta: 0.22
    bandwidth: 1.0
    window: [0.00, 0.42]
    max_relative_norm: 0.12

calibration:
  seed: 271828
  denoising_step_index: 0
  final_prompt_access: forbidden
