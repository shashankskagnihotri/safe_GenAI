neutral_concept: realistic continuous view of the same completely empty outdoor shopping mall, no people or human figures,
  fixed architectural shell and storefront geometry preserved, natural daylight intensity preserved, same smooth continuous
  camera trajectory, 15 seconds at 16 fps and 240 frames, temporally coherent architecture, no cuts or scene changes, all
  non-target regions and attributes unchanged. Same empty mall and named structures remain fully visible; no person, cut,
  crop, scene change or object loss.
design_contract:
- Every pair preserves the same uninterrupted 15-second camera route, timing, 16-fps encoding, 240-frame count, temporal consistency,
  and absence of cuts.
- Working upward/downward escalators are source invariants for sky-only, floor-only, signage-only, and merchandise-only ablations.
  Only the circulation pair, or a full five-pair intervention, makes the stairs stationary.
- Sky color is spatially confined to the sky; target pink must not create a sunset or global magenta cast across the mall.
- Vertical marble stairs and horizontal ceramic tile are distinct target regions and must coexist in full steering without
  material leakage.
- Cars are stationary full-size retail displays, not moving traffic or toys; only minimal local retail-display reflow is allowed.
