name: finer_detailing_03_empty_outdoor_mall_t2i
modality: text_to_image
neutral_concept: 'realistic wide-angle view of the same completely empty outdoor shopping mall, no people or human figures, fixed architectural shell and storefront geometry preserved, natural daylight intensity preserved, coherent perspective, great detail, all non-target regions and attributes unchanged'
design_contract:
  - 'Every endpoint names the other four source attributes explicitly. This makes each single-pair ablation a minimal intervention rather than an implicit full target prompt.'
  - 'Sky color is spatially confined to the sky: pink must not become a sunset treatment or a global magenta cast.'
  - 'Vertical circulation and horizontal flooring are disambiguated: target marble belongs only to the stairs, while target ceramic tile belongs only to the walking floor.'
  - 'Cars are stationary, full-size retail displays rather than traffic or toys. Minimal display reflow is allowed, but the architectural shell and camera framing remain fixed.'
  - 'The full target is obtained only by activating all five pairs together; target-reference prompts are never substituted for these pairwise vector fields.'
