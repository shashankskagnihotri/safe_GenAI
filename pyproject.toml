[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riddikulus"
version = "1.0.0"
description = "Inference-time safety steering with a fixed latent-selected concept pool."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Safety GenAI Research"}]
dependencies = ["torch>=2.5,<3", "numpy>=1.26", "pillow>=10", "pyyaml>=6", "safetensors>=0.8"]

[project.optional-dependencies]
diffusion = ["diffusers>=0.39", "transformers>=5.8", "accelerate>=1.13", "ftfy"]
evaluation = ["google-genai", "matplotlib", "seaborn", "pandas", "scipy"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
riddikulus = "riddikulus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["riddikulus", "riddikulus.*", "riddikulus_evaluation", "riddikulus_evaluation.*"]

[tool.setuptools.package-data]
riddikulus = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
